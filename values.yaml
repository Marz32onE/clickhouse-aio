# =============================================================================
# clickhouse-aio — production defaults (small-business size)
# =============================================================================
# Topology (default):
#   - Official ClickHouse Operator (cluster-scoped)
#   - ClickHouse Keeper: 3 nodes (quorum)
#   - ClickHouse: 1 shard × 3 replicas (HA, no over-sharding)
#   - Storage: 200Gi data / 20Gi keeper per pod
#   - Resources: CH 2–4 CPU / 8–16Gi RAM; Keeper 0.5–1 CPU / 1–2Gi RAM
#
# Single shard is deliberate: every replica holds the full dataset, so a query
# against any node is complete. Sharding needs a Distributed table in front of
# the otel_* tables — the rotel DDL tool does not create one, so raising
# `shards` on its own silently returns one shard's worth of rows. See
# "Scaling path" in the README before changing it.
#
# Prerequisites:
#   - Kubernetes >= 1.28 (operator recommends 1.33+)
#   - cert-manager (required when operator.certManager.enabled=true, default)
#   - StorageClass with volume expansion preferred (set storageClassName below)
#
# Install:
#   helm dependency update
#   helm upgrade --install ch-aio . -n clickhouse --create-namespace
# =============================================================================

# -----------------------------------------------------------------------------
# Official ClickHouse Operator (subchart alias: operator)
# Chart: oci://ghcr.io/clickhouse/clickhouse-operator-helm
# Docs:  https://clickhouse.com/docs/clickhouse-operator/install/helm
# -----------------------------------------------------------------------------
operator:
  enabled: true

  ## Naming for the operator's own objects (Deployment, ServiceAccount, RBAC).
  nameOverride: ""
  fullnameOverride: ""

  ## Namespaces the operator reconciles. Empty means cluster-wide, which
  ## requires rbac.namespaced=false. With namespaced RBAC this must list
  ## exactly the release namespace — the operator would otherwise watch
  ## namespaces its Role does not cover and log permission errors forever.
  controller:
    watchNamespaces:
      - clickhouse
    pdbManagement:
      enabled: true

  ## Pinned explicitly rather than falling through to the subchart's
  ## appVersion default, so the operator version is visible here and an upgrade
  ## of the vendored chart cannot move it on its own.
  image:
    registry: ""
    repository: ghcr.io/clickhouse/clickhouse-operator
    tag: "v0.0.7"
    pullPolicy: IfNotPresent

  manager:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    ## Annotations on the Deployment object itself, not on its Pods.
    annotations: {}
    # annotations:
    #   argocd.argoproj.io/sync-options: Prune=false

    ## Annotations and labels on the manager Pod. Note the nesting: this is
    ## `manager.pod.annotations`, not a flat podAnnotations — the subchart keeps
    ## Deployment metadata (above) and Pod metadata (here) apart.
    ##
    ## Four annotation keys are silently dropped if you set them here, because
    ## the subchart owns them: kubectl.kubernetes.io/default-container, and
    ## prometheus.io/{scrape,path,port}. The prometheus trio is driven by
    ## operator.prometheus.scraping_annotations below (on by default), so turn
    ## that off rather than trying to override it here.
    pod:
      annotations: {}
      # annotations:
      #   karpenter.sh/do-not-disrupt: "true"
      #   vault.hashicorp.com/agent-inject: "false"
      labels: {}
      # labels:
      #   tier: control-plane

    ## Manager Pod scheduling. It only talks to the API server, so it does not
    ## need to sit on the database nodes.
    nodeSelector: {}
    # nodeSelector:
    #   node-role.kubernetes.io/control-plane: ""
    tolerations: []
    # tolerations:
    #   - key: node-role.kubernetes.io/control-plane
    #     operator: Exists
    #     effect: NoSchedule
    ## The subchart ships a required nodeAffinity pinning the manager to known
    ## arch/os values. Setting this key replaces it outright, so repeat what you
    ## still want. Drop it to {} on homogeneous nodes.
    # affinity: {}

  rbac:
    ## Role/RoleBinding scoped to the release namespace instead of a
    ## ClusterRole. The operator then only reaches resources in its own
    ## namespace, so the ClickHouseCluster must be installed there too — see
    ## "Operator RBAC scope" in the README. Set false to manage clusters across
    ## namespaces.
    namespaced: true
    helpers:
      enabled: false

  serviceAccount:
    enabled: true

  crd:
    enabled: true
    keep: true

  metrics:
    enabled: true
    port: 8080
    secure: true

  ## Webhooks require cert-manager
  certManager:
    enabled: true

  webhook:
    enabled: true
    port: 9443

  prometheus:
    scraping_annotations: true
    ## Set true if prometheus-operator ServiceMonitor CRDs exist
    enabled: false

  networkPolicy:
    enabled: false

# -----------------------------------------------------------------------------
# Cluster subchart — KeeperCluster + ClickHouseCluster CRs
# -----------------------------------------------------------------------------
cluster:
  enabled: true

  ## Naming. Everything defaults to <release>-cluster: the two CRs, the rotel
  ## Deployment/Service/Jobs, the generated password Secret and the per-replica
  ## PVCs all hang off it, so an override renames the OTLP endpoint and the
  ## password Secret along with them.
  ##
  ## nameOverride is install-time only — it also sets app.kubernetes.io/name,
  ## which is a selector label, and a Deployment's spec.selector is immutable.
  ## Changing it on a live release fails the upgrade until the rotel Deployment
  ## is deleted by hand. fullnameOverride does not touch the labels.
  nameOverride: ""
  fullnameOverride: ""
  # fullnameOverride: analytics

  commonLabels:
    environment: production
    app.kubernetes.io/part-of: clickhouse-aio

  # ---- ClickHouse Keeper ----------------------------------------------------
  keeper:
    enabled: true
    replicas: 3
    image:
      registry: docker.io
      repository: clickhouse/clickhouse-keeper
      tag: "26.7.1.1315"
      pullPolicy: IfNotPresent
    persistence:
      ## Set to your CSI class (e.g. gp3, premium-rwo, local-path for lab)
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 20Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    podTemplate:
      ## topologyZoneKey / nodeHostnameKey are left at the subchart defaults,
      ## which are the values the operator's API reference recommends: spread
      ## across topology.kubernetes.io/zone, one pod per kubernetes.io/hostname.
      ## Both need the node labels to exist, and nodeHostnameKey needs at least
      ## as many nodes as replicas — see charts/cluster/values.yaml, and "Dev /
      ## local cluster" in the README for a single-node override. To loosen the
      ## spread, set podTemplate.topologySpreadConstraints (the operator's own
      ## field) rather than looking for a chart-level shorthand.
      ##
      ## Scheduling. nodeSelector alone does not get a pod onto a tainted node —
      ## pair it with tolerations. affinity is appended to the operator's own
      ## rules rather than replacing them.
      nodeSelector: {}
      # nodeSelector:
      #   node-role.kubernetes.io/database: "true"
      tolerations: []
      # tolerations:
      #   - key: dedicated
      #     operator: Equal
      #     value: clickhouse
      #     effect: NoSchedule
      affinity: {}
      labels: {}
      annotations: {}
      # annotations:
      #   karpenter.sh/do-not-disrupt: "true"   # keep the autoscaler off a quorum member

  # ---- ClickHouse servers ---------------------------------------------------
  clickhouse:
    enabled: true
    ## 3 replicas: tolerates losing one node while keeping a majority, and every
    ## replica carries the full dataset
    replicas: 3
    ## Stay single-shard: without a Distributed table, >1 shard makes every
    ## query return only the shard it landed on. See the header note.
    shards: 1
    image:
      registry: docker.io
      repository: clickhouse/clickhouse-server
      tag: "26.7.1.1315"
      pullPolicy: IfNotPresent
    persistence:
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      ## Per-replica; plan for ~6–12 months of compressed analytics data
      size: 200Gi
      ## Give individual replicas their own StorageClass or size. The chart
      ## pre-creates those claims under the name the StatefulSet would generate,
      ## one ArgoCD wave ahead of the CRs, and the StatefulSet adopts them.
      ## Only for deliberately asymmetric replicas — ClickHouse replication
      ## assumes comparable hardware. See charts/cluster/values.yaml.
      perReplica: []
      # perReplica:
      #   - replica: 0
      #     storageClassName: fast-nvme
      #   - replica: 1
      #     storageClassName: standard-ssd
      #     size: 500Gi
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
      limits:
        cpu: "4"
        memory: 16Gi
    podTemplate:
      ## Placement keys left at the subchart defaults — see keeper above.
      nodeSelector: {}
      # nodeSelector:
      #   node-role.kubernetes.io/database: "true"
      tolerations: []
      # tolerations:
      #   - key: dedicated
      #     operator: Equal
      #     value: clickhouse
      #     effect: NoSchedule
      affinity: {}
      labels: {}
      annotations: {}

    ## Version-detection Job the operator runs before each (re)deploy. The CRD
    ## exposes only nodeSelector for it — no tolerations, so it cannot reach a
    ## tainted node pool that the servers themselves tolerate.
    versionProbe:
      nodeSelector: {}
      annotations: {}
      labels: {}

    defaultUser:
      ## Prefer: --set cluster.clickhouse.defaultUser.password='...'
      ## or create a Secret and set existingSecret
      password: ""
      existingSecret: ""
      existingSecretKey: password
      passwordType: password
      autoGenerate: true

    settings:
      enableDatabaseSync: true
      extraConfig:
        max_concurrent_queries: 100
        max_server_memory_usage_to_ram_ratio: 0.9
        background_pool_size: 16
        background_merges_mutations_concurrency_ratio: 2
        mark_cache_size: 5368709120
        uncompressed_cache_size: 8589934592
        logger:
          level: information
          console: 1
        ## Prometheus metrics need no config here: the operator exposes
        ## port 9363 automatically (protocols.prometheus).
      ## ClickHouse users, profiles and row policies, passed through to the
      ## operator verbatim. This is the only user mechanism the chart offers:
      ##   grant, no filter -> the whole table
      ##   grant + filter   -> only the rows matching the filter
      ##   no grant         -> nothing, whatever the filters say
      ## Grants are table/column level, so row scoping needs the per-table
      ## `filter` under `databases` — it cannot be expressed with grants alone.
      ##
      ## Shape traps: `grants` is one `query` key holding a list (repeated
      ## {query: ...} maps render as repeated <grants> elements and ClickHouse
      ## honours only the first), and a table listed under `databases` without a
      ## `filter` is not a restriction at all.
      ##
      ## Users defined here are read-only at runtime — granting another table
      ## later means editing this and running `helm upgrade`, not GRANT.
      extraUsersConfig:
        profiles:
          ## The `web` profile from the ClickHouse docs, verbatim:
          ## https://clickhouse.com/docs/concepts/features/configuration/settings/settings-profiles
          ##
          ## Every value below is theirs. The chart previously carried numbers
          ## picked by hand, including a max_memory_usage larger than the
          ## container limit, which made it a no-op. The official set avoids the
          ## problem by bounding rows, bytes read and query shape rather than
          ## process memory, so it does not have to track resources.limits.
          ##
          ## `readonly: 1` at the end blocks writes and also freezes every
          ## setting in the session: a SET is rejected with
          ## "Cannot modify '<name>' setting in readonly mode" (code 164),
          ## before any constraint is consulted. That is why there is no
          ## `constraints` block — under readonly it could never fire.
          ##
          ## Two of these are tight enough to notice. max_columns_to_read: 25
          ## clears otel_traces (22 columns) and otel_logs (16) but not a join
          ## of the two, and max_subquery_depth: 2 rejects deeply nested BI
          ## queries. Raise those two if a dashboard starts failing.
          readonly_user:
            max_rows_to_read: 1000000000
            max_bytes_to_read: 100000000000
            max_rows_to_group_by: 1000000
            group_by_overflow_mode: any
            max_rows_to_sort: 1000000
            max_bytes_to_sort: 1000000000
            max_result_rows: 100000
            max_result_bytes: 100000000
            result_overflow_mode: break
            max_execution_time: 600
            min_execution_speed: 1000000
            timeout_before_checking_execution_speed: 15
            max_columns_to_read: 25
            max_temporary_columns: 100
            max_temporary_non_const_columns: 50
            max_subquery_depth: 2
            max_pipeline_depth: 25
            max_ast_depth: 50
            max_ast_elements: 100
            max_sessions_for_user: 4
            readonly: 1
        users:
          ## Whole-table reader. Other users' row policies do not narrow it —
          ## they are created with apply_to_all=0 and bind only the users they
          ## name (SELECT name, apply_to_all FROM system.row_policies).
          reporter:
            ## Read from the container env below, so it reaches neither the CR
            ## nor preprocessed_configs/users.xml.
            password:
              "@from_env": CH_REPORTER_PASSWORD
              "@hide_in_preprocessed": true
            profile: readonly_user
            networks:
              ip: "::/0"
            grants:
              query:
                - GRANT SELECT ON otel.otel_traces
                - GRANT SELECT ON otel.otel_logs
                ## Column-level works too, and makes SELECT * fail:
                # - GRANT SELECT(Timestamp, TraceId, ServiceName, SpanName, Duration) ON otel.otel_traces

          ## Namespace-scoped reader. Same grants as reporter, narrowed by a
          ## filter per table. A granted table with no filter entry returns
          ## *every* row, so the two lists have to be kept in step by hand —
          ## that is the one mistake in this block worth re-reading for.
          ##
          ## Needs the namespace on the telemetry itself; rotel does not enrich
          ## spans, so instrumented workloads publish it:
          ##   env:
          ##     - name: POD_NAMESPACE
          ##       valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ##     - name: OTEL_RESOURCE_ATTRIBUTES
          ##       value: k8s.namespace.name=$(POD_NAMESPACE)
          ## Rows missing the attribute match no filter and stay invisible.
          ##
          ## otel_traces_trace_id_ts is deliberately never granted: it holds
          ## only trace ids and timestamps, so there is nothing to filter on.
          team_a:
            password:
              "@from_env": CH_TEAM_A_PASSWORD
              "@hide_in_preprocessed": true
            profile: readonly_user
            networks:
              ip: "::/0"
            databases:
              otel:
                otel_traces:
                  filter: "ResourceAttributes['k8s.namespace.name'] IN ('team-a', 'team-a-staging')"
                otel_logs:
                  filter: "ResourceAttributes['k8s.namespace.name'] IN ('team-a', 'team-a-staging')"
            grants:
              query:
                - GRANT SELECT ON otel.otel_traces
                - GRANT SELECT ON otel.otel_logs

    ## Env for the ClickHouse containers, one entry per user password above.
    ## The chart generates no Secret for these users — create them first, or
    ## every ClickHouse pod stops at CreateContainerConfigError rather than
    ## just that user being disabled:
    ##   kubectl -n clickhouse create secret generic reporter-ch-password \
    ##     --from-literal=password='CHANGE_ME'
    ## Rotating a password needs a pod restart: env is fixed at container start.
    containerTemplate:
      env:
        - name: CH_REPORTER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: reporter-ch-password
              key: password
        - name: CH_TEAM_A_PASSWORD
          valueFrom:
            secretKeyRef:
              name: team-a-ch-password
              key: password

    ## Note: port 9363 is reserved by the operator for Prometheus metrics —
    ## do not add it here (validation webhook rejects it).
    additionalPorts: []

  # ---- Rotel OTLP collector (traces/logs → ClickHouse) ----------------------
  rotel:
    enabled: true
    replicas: 1
    image:
      registry: docker.io
      repository: streamfold/rotel
      tag: "v0.2.2"
      pullPolicy: IfNotPresent
    ## Creates the otel_* tables. Keep on the same version as the agent above.
    ddlImage:
      registry: docker.io
      repository: streamfold/rotel-clickhouse-ddl
      tag: "v0.2.2"
      pullPolicy: IfNotPresent
    telemetry:
      traces: true
      logs: true
      metrics: false
    ## Agent stdout format (pod logs only, never written to ClickHouse)
    logFormat: json
    ## Opt-in: Rotel's own runtime metrics → VictoriaMetrics (OTLP/HTTP).
    ## Set endpoint to your VM OTLP base URL (Rotel appends /v1/metrics).
    ## Also holds the OTLP metrics receiver open — see charts/cluster/values.yaml.
    internalMetrics:
      enabled: false
      # endpoint: http://vmsingle.monitoring.svc:8428/opentelemetry
      endpoint: ""
    ## Scale the collector on CPU. Needs metrics-server.
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 75
    ## Collector Pod. Stateless and on the OTLP hot path, so it usually belongs
    ## near the workloads sending telemetry rather than on the database nodes.
    podLabels: {}
    podAnnotations: {}
    # podAnnotations:
    #   prometheus.io/scrape: "false"
    nodeSelector: {}
    # nodeSelector:
    #   node-role.kubernetes.io/observability: "true"
    tolerations: []
    # tolerations:
    #   - key: dedicated
    #     operator: Equal
    #     value: observability
    #     effect: NoSchedule
    affinity: {}
    ## Schema (createSchema) and retention (manageTtl) hook Jobs. Give them the
    ## database tolerations if that node pool is tainted — a hook Job that can
    ## never schedule blocks the whole `helm upgrade` until it times out.
    jobs:
      podLabels: {}
      podAnnotations: {}
      # podAnnotations:
      #   sidecar.istio.io/inject: "false"     # a sidecar keeps the Job Running forever
      nodeSelector: {}
      tolerations: []
      # tolerations:
      #   - key: dedicated
      #     operator: Equal
      #     value: clickhouse
      #     effect: NoSchedule
      affinity: {}
    exporter:
      ## HA profile (2 replicas): replicate otel tables across the cluster
      engine: ReplicatedMergeTree
      cluster: default
      ## Replicated puts every DDL statement in a Keeper log all members replay,
      ## so a replica added later inherits the schema with the same table UUIDs
      ## and therefore actually replicates. Atomic leaves a new replica to have
      ## its tables recreated under a fresh UUID, which silently splits writes.
      ## Cannot be changed in place on an existing database — see the README.
      databaseEngine: Replicated
      ## Retention for the otel tables, as <number><s|m|h|d> ("0s" = forever).
      ## Applied to existing tables on every upgrade via cluster.rotel.manageTtl.
      ttl: 168h
      ## Tables are named <prefix>_traces / <prefix>_logs. Override the prefix
      ## per signal to split them apart; empty inherits exporter.tablePrefix.
      # traces:
      #   tablePrefix: app
      # logs:
      #   tablePrefix: sys

  # ---- TLS (optional; needs cert-manager Issuer) ----------------------------
  ## Mutual TLS for ClickHouse <-> Keeper and client connections. Needs
  ## cert-manager plus an Issuer/ClusterIssuer named in issuerRef.
  tls:
    enabled: false
    required: true
    createCertificates: true
    issuerRef:
      name: ""
      kind: Issuer

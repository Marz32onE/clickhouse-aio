# Enable mutual TLS for ClickHouse <-> Keeper and client connections.
# Requires:
#   1. cert-manager installed
#   2. An Issuer or ClusterIssuer (set issuerRef below)
#
# Usage:
#   helm upgrade --install ch-aio . -n clickhouse -f values.yaml -f values-tls.yaml \
#     --set cluster.tls.issuerRef.name=local-issuer

cluster:
  tls:
    enabled: true
    required: true
    createCertificates: true
    issuerRef:
      name: local-issuer
      kind: Issuer

  loadBalancer:
    # Secure native protocol when TLS required
    port: 9440
    targetPort: 9440

## Default values for the cluster subchart.
## Parent chart (clickhouse-aio) overrides these for production small-business sizing.

nameOverride: ""
fullnameOverride: ""
## Override shared base name for KeeperCluster + ClickHouseCluster CRs
## (official examples use the same name for both kinds).
clusterName: ""
commonLabels: {}

## ArgoCD integration: annotate cluster resources with a sync-wave so the
## operator (wave 0) is deployed and healthy before the CRs sync, and skip
## dry-run while the operator's CRDs are not registered yet.
## Requires defaultUser.existingSecret (or a fixed password): ArgoCD renders
## templates without cluster access, so lookup-based password generation
## would mint a new password on every sync.
argocd:
  enabled: false
  syncWave: "1"

# ---------------------------------------------------------------------------
# ClickHouse Keeper (coordination — required for replication)
# ---------------------------------------------------------------------------
keeper:
  enabled: true
  ## Override KeeperCluster metadata.name (default: shared clusterName)
  name: ""
  ## Odd number required for quorum. Do not change after first deploy.
  replicas: 3

  image:
    repository: clickhouse/clickhouse-keeper
    tag: "26.3"
    pullPolicy: IfNotPresent

  persistence:
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations: {}

  ## Small-business production resources (coordination is light vs server)
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  podTemplate:
    ## Domain replicas are balanced across. Node-level by default so it works on
    ## clusters without zone labels; set "topology.kubernetes.io/zone" for AZ
    ## spreading.
    topologyZoneKey: kubernetes.io/hostname
    ## How hard that spreading is enforced over topologyZoneKey:
    ##   ScheduleAnyway  — best effort; replicas share a domain when there are
    ##                     fewer domains than replicas
    ##   DoNotSchedule   — strict; excess replicas stay Pending
    ##   ""              — emit no spread constraint (operator default applies,
    ##                     which is equivalent to DoNotSchedule)
    spreadPolicy: ScheduleAnyway
    ## Empty on purpose: a non-empty value makes the operator emit a *required*
    ## PodAntiAffinity (one pod per node, excess pods stay Pending) that cannot
    ## be relaxed later, because user `affinity` is appended to operator
    ## defaults rather than replacing them. Set it only to enforce exclusive
    ## node occupancy.
    nodeHostnameKey: ""
    labels: {}
    annotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    ## Escape hatch: a non-empty list replaces whatever spreadPolicy would
    ## generate. Entries merge into the operator defaults by topologyKey, so use
    ## topologyZoneKey's value to adjust the generated constraint and any other
    ## key to add one. Omit labelSelector on the former — the operator fills in
    ## the pod labels; a constraint with an empty selector matches nothing.
    topologySpreadConstraints: []

  settings: {}
  # settings:
  #   extraConfig:
  #     logger/level: information

# ---------------------------------------------------------------------------
# ClickHouse server cluster
# ---------------------------------------------------------------------------
clickhouse:
  enabled: true
  ## Override ClickHouseCluster metadata.name (default: shared clusterName)
  name: ""
  ## Replicas per shard (HA). 2 is enough for small production.
  replicas: 2
  ## Horizontal partitions. Keep 1 until you need more write/query scale.
  shards: 1

  image:
    repository: clickhouse/clickhouse-server
    tag: "26.3"
    pullPolicy: IfNotPresent

  persistence:
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    ## Per-replica data volume — sized for small production analytics
    size: 200Gi
    annotations: {}

  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi

  podTemplate:
    ## See the keeper.podTemplate comments above for what each field does.
    topologyZoneKey: kubernetes.io/hostname
    spreadPolicy: ScheduleAnyway
    nodeHostnameKey: ""
    labels: {}
    annotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    volumes: []

  ## default user authentication
  defaultUser:
    ## Create a Secret from plaintext (dev only). Prefer existingSecret in prod.
    password: ""
    ## Existing Secret name containing the password key
    existingSecret: ""
    ## Key inside the secret (default: password)
    existingSecretKey: password
    ## password | password_sha256_hex | password_double_sha1_hex
    passwordType: password
    ## When true and no password/secret is set, generate a random password Secret
    autoGenerate: true

  ## Reference to KeeperCluster (auto-wired when keeper.enabled)
  keeperClusterRef:
    name: ""

  ## Version-detection Job the operator runs before each (re)deploy.
  ## Operator default is 256Mi which OOMs with clickhouse-server >= 26.x
  ## (clickhouse-local startup footprint grew). Bump via this override.
  versionProbe:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

  ## Server / user settings (official operator settings block)
  settings:
    enableDatabaseSync: true
    ## Server-level config (YAML → ClickHouse config)
    extraConfig:
      # Production-lean defaults for small business
      max_concurrent_queries: 100
      max_server_memory_usage_to_ram_ratio: 0.9
      background_pool_size: 16
      background_merges_mutations_concurrency_ratio: 2
      mark_cache_size: 5368709120          # 5 GiB
      uncompressed_cache_size: 8589934592  # 8 GiB
      logger:
        level: information
        console: 1
      # Prometheus metrics need no config here: the operator exposes
      # port 9363 automatically (protocols.prometheus).

    ## Merged on top of the users generated from clickhouse.tenants below, so
    ## an entry here with the same user name replaces the generated one.
    ## Note the `grants` shape: a single key holding a list of query strings.
    ## A list of {query: ...} maps renders as repeated <grants> XML elements and
    ## ClickHouse honours only the first, silently dropping the rest.
    extraUsersConfig: {}
    # extraUsersConfig:
    #   users:
    #     app:
    #       password_sha256_hex: "..."
    #       profile: default
    #       grants:
    #         query:
    #           - "GRANT SELECT, INSERT ON app_db.*"
    #   profiles:
    #     readonly:
    #       readonly: 1

  ## ---------------------------------------------------------------------
  ## Tenants: read-only users that can only see rows belonging to their own
  ## Kubernetes namespaces, enforced by a ClickHouse row policy.
  ##
  ## The namespace has to be on the telemetry itself — rotel does not enrich
  ## spans with Kubernetes metadata. Instrumented workloads should publish it,
  ## e.g. via the downward API:
  ##   env:
  ##     - name: POD_NAMESPACE
  ##       valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
  ##     - name: OTEL_RESOURCE_ATTRIBUTES
  ##       value: k8s.namespace.name=$(POD_NAMESPACE)
  ## Rows whose attribute is missing or unknown are visible to no tenant.
  ## ---------------------------------------------------------------------
  tenants:
    ## Database holding the tables below. Defaults to rotel.exporter.database.
    database: ""
    ## ResourceAttributes key carrying the Kubernetes namespace.
    namespaceAttribute: k8s.namespace.name
    ## Tables tenants may read. Each one gets both the SELECT grant and the row
    ## filter, so only add tables that have a ResourceAttributes column — a
    ## granted table without a usable filter returns every tenant's rows.
    ## otel_traces_trace_id_ts is deliberately absent: it holds only trace ids
    ## and timestamps, so it cannot be filtered by namespace.
    tables:
      - otel_traces
      - otel_logs
    ## Each user gets a Secret named <cluster>-tenant-<name>-password with a
    ## generated password unless existingSecret or password is set.
    users: []
    # users:
    #   - name: team_a               # ClickHouse identifier: [A-Za-z_][A-Za-z0-9_]*
    #     namespaces: [team-a, team-a-staging]
    #     ## Optional: bring your own Secret instead of a generated one
    #     existingSecret: ""
    #     existingSecretKey: password
    #     ## Optional: fixed password (prefer --set over committing it)
    #     password: ""
    #     ## Optional: profile granting more than read-only
    #     profile: tenant_readonly

  ## Extra container ports. Port 9363 is reserved by the operator for
  ## Prometheus metrics — the validation webhook rejects it here.
  additionalPorts: []

  containerTemplate:
    env: []
    volumeMounts: []

# ---------------------------------------------------------------------------
# Rotel — lightweight Rust OTLP collector writing traces/logs into ClickHouse
# https://github.com/rotel-dev/rotel
# Schema-compatible with the OpenTelemetry ClickHouse exporter (otel_traces …).
# ---------------------------------------------------------------------------
rotel:
  enabled: false
  replicas: 1

  image:
    repository: streamfold/rotel
    tag: "v0.2.2"
    pullPolicy: IfNotPresent

  ## Companion image creating the otel_* table DDL (rotel does not auto-create)
  ddlImage:
    repository: streamfold/rotel-clickhouse-ddl
    tag: "v0.2.2"
    pullPolicy: IfNotPresent

  ## Run a post-install/upgrade Job that creates database + tables
  createSchema: true

  ## Run a post-install/upgrade Job that re-applies exporter.ttl to the existing
  ## otel tables, making the value below effective on upgrades rather than only
  ## at table-creation time. Reuses each table's own TTL expression, so a table
  ## created with ttl=0s is skipped — it has none to modify.
  manageTtl: true

  ## Which OTLP signals to accept and store
  telemetry:
    traces: true
    logs: true
    metrics: false

  exporter:
    ## Default: http://<cluster>-clickhouse-headless.<ns>.svc.cluster.local:8123
    endpoint: ""
    database: otel
    tablePrefix: otel
    user: default
    ## Reuse the ClickHouse default-user secret unless set
    existingSecret: ""
    existingSecretKey: password
    compression: lz4
    asyncInsert: true
    ## ClickHouse JSON column type for attributes (needs recent ClickHouse)
    enableJson: false
    ## MergeTree for single replica; ReplicatedMergeTree + cluster for HA
    engine: MergeTree
    ## remote_servers cluster name for ON CLUSTER DDL (operator default: "default")
    cluster: ""
    ## Row TTL for otel tables ("0s" = keep forever). Accepts <number><s|m|h|d>.
    ## The DDL tool only writes TTL when it creates a table, so changing this on
    ## an existing install does nothing on its own — manageTtl below re-applies
    ## it with ALTER ... MODIFY TTL after every upgrade.
    ttl: 168h

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: ClusterIP
    annotations: {}

  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraArgs: []
  extraEnv: []

# ---------------------------------------------------------------------------
# Optional in-cluster TLS (requires cert-manager + issuer)
# ---------------------------------------------------------------------------
tls:
  enabled: false
  ## When true, insecure ports are disabled
  required: true
  ## Create cert-manager Certificates (needs an Issuer/ClusterIssuer)
  createCertificates: true
  issuerRef:
    name: ""
    kind: Issuer   # or ClusterIssuer
  clickhouse:
    existingSecret: ""
  keeper:
    existingSecret: ""

# ---------------------------------------------------------------------------
# Optional external LoadBalancer for clients
# ---------------------------------------------------------------------------
loadBalancer:
  enabled: false
  annotations: {}
  labels: {}
  ## Prefer secure native port when TLS is required; otherwise native 9000
  port: 9000
  targetPort: 9000
  loadBalancerSourceRanges: []
  ## Selector override (defaults to app: <clickhouse-name>-clickhouse)
  selector: {}

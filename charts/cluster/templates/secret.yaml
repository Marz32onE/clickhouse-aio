{{- if and .Values.clickhouse.enabled (not .Values.clickhouse.defaultUser.existingSecret) }}
{{- if and .Values.argocd.enabled .Values.clickhouse.defaultUser.autoGenerate (not .Values.clickhouse.defaultUser.password) }}
{{- fail "argocd.enabled: auto-generated passwords rotate on every ArgoCD sync (templates render without cluster access, so lookup cannot reuse the existing Secret). Set clickhouse.defaultUser.existingSecret (recommended) or a fixed password." }}
{{- end }}
{{- $secretName := include "cluster.passwordSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := .Values.clickhouse.defaultUser.password }}
{{- if and (not $password) .Values.clickhouse.defaultUser.autoGenerate }}
  {{- if $existing }}
    {{- $password = index $existing.data (.Values.clickhouse.defaultUser.existingSecretKey | default "password") | b64dec }}
  {{- else }}
    {{- $password = randAlphaNum 32 }}
  {{- end }}
{{- end }}
{{- if $password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
  annotations:
    # Preserve auto-generated password across upgrades when using lookup
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.clickhouse.defaultUser.existingSecretKey | default "password" }}: {{ $password | quote }}
{{- else if not .Values.clickhouse.defaultUser.autoGenerate }}
{{- fail "cluster.clickhouse.defaultUser: set password, existingSecret, or autoGenerate=true" }}
{{- end }}
{{- end }}

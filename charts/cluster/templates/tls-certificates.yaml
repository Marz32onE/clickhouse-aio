{{- if and .Values.tls.enabled .Values.tls.createCertificates }}
{{- if not .Values.tls.issuerRef.name }}
{{- fail "tls.enabled with createCertificates requires tls.issuerRef.name" }}
{{- end }}
{{- $ns := .Release.Namespace }}
{{- $chName := include "cluster.clickhouseName" . }}
{{- $keeperName := include "cluster.keeperName" . }}
{{- if and .Values.keeper.enabled (not .Values.tls.keeper.existingSecret) }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $keeperName }}-keeper-tls
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: keeper-tls
  {{- with include "cluster.argocdAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ include "cluster.keeperTlsSecretName" . }}
  issuerRef:
    name: {{ .Values.tls.issuerRef.name }}
    kind: {{ .Values.tls.issuerRef.kind }}
  # Operator service pattern: <KeeperCluster.metadata.name>-keeper-headless
  #
  # Both forms are needed. A TLS wildcard matches exactly one label, so
  # `*.<svc>.<ns>.svc` covers the per-Pod name and *not* the Service name itself
  # — which is the name clients actually connect to.
  dnsNames:
    - "{{ $keeperName }}-keeper-headless.{{ $ns }}.svc"
    - "{{ $keeperName }}-keeper-headless.{{ $ns }}.svc.cluster.local"
    - "*.{{ $keeperName }}-keeper-headless.{{ $ns }}.svc"
    - "*.{{ $keeperName }}-keeper-headless.{{ $ns }}.svc.cluster.local"
---
{{- end }}
{{- if and .Values.clickhouse.enabled (not .Values.tls.clickhouse.existingSecret) }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $chName }}-clickhouse-tls
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse-tls
  {{- with include "cluster.argocdAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  secretName: {{ include "cluster.clickhouseTlsSecretName" . }}
  issuerRef:
    name: {{ .Values.tls.issuerRef.name }}
    kind: {{ .Values.tls.issuerRef.kind }}
  # Operator service pattern: <ClickHouseCluster.metadata.name>-clickhouse-headless
  #
  # The bare Service names matter as much as the wildcards: a wildcard matches
  # exactly one label, so `*.<svc>.<ns>.svc` covers per-Pod names only. Rotel and
  # every query client dial the Service name, which no wildcard here matches.
  dnsNames:
    - "{{ $chName }}-clickhouse-headless.{{ $ns }}.svc"
    - "{{ $chName }}-clickhouse-headless.{{ $ns }}.svc.cluster.local"
    - "*.{{ $chName }}-clickhouse-headless.{{ $ns }}.svc"
    - "*.{{ $chName }}-clickhouse-headless.{{ $ns }}.svc.cluster.local"
    {{- if .Values.clickhouse.service.enabled }}
    - "{{ include "cluster.clickhouseServiceName" . }}.{{ $ns }}.svc"
    - "{{ include "cluster.clickhouseServiceName" . }}.{{ $ns }}.svc.cluster.local"
    {{- end }}
{{- end }}
{{- end }}

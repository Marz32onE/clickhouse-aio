{{- if .Values.rotel.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cluster.rotelName" . }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: rotel
  {{- $svcAnnotations := merge (dict) (.Values.rotel.service.annotations | default dict) }}
  {{- if .Values.argocd.enabled }}
  {{- $_ := set $svcAnnotations "argocd.argoproj.io/sync-wave" .Values.argocd.syncWave }}
  {{- end }}
  {{- with $svcAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.rotel.service.type }}
  selector:
    {{- include "cluster.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rotel
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
{{- end }}

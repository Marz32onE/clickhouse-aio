# Lightweight profile for local / CI clusters (kind, k3d, minikube)
# Usage: helm upgrade --install ch-aio . -n clickhouse --create-namespace -f values-dev.yaml

operator:
  manager:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  metrics:
    secure: false
  prometheus:
    scraping_annotations: false

cluster:
  commonLabels:
    environment: development

  keeper:
    replicas: 1
    persistence:
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    podTemplate:
      # Single-node clusters rarely have zone labels
      topologyZoneKey: ""
      nodeHostnameKey: kubernetes.io/hostname

  clickhouse:
    replicas: 1
    shards: 1
    persistence:
      size: 20Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    podTemplate:
      topologyZoneKey: ""
      nodeHostnameKey: kubernetes.io/hostname
    settings:
      extraConfig:
        max_concurrent_queries: 50
        mark_cache_size: 536870912
        uncompressed_cache_size: 1073741824
        logger:
          level: information
          console: 1
        prometheus:
          endpoint: /metrics
          port: 9363
          metrics: true
          events: true
          asynchronous_metrics: true
          status_info: true

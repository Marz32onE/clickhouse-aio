# Lightweight profile for local / CI clusters (kind, k3d, minikube)
# Usage: helm upgrade --install ch-aio . -n clickhouse --create-namespace -f values-dev.yaml

operator:
  manager:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  metrics:
    secure: false
  prometheus:
    scraping_annotations: false

cluster:
  commonLabels:
    environment: development

  keeper:
    replicas: 1
    persistence:
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # podTemplate omitted: chart defaults already spread by node, best-effort,
    # so replicas fit on a single-node kind/k3d/minikube cluster.

  clickhouse:
    replicas: 1
    shards: 1
    persistence:
      size: 20Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    settings:
      extraConfig:
        max_concurrent_queries: 50
        mark_cache_size: 536870912
        uncompressed_cache_size: 1073741824
        logger:
          level: information
          console: 1

  rotel:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
